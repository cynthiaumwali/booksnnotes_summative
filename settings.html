<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles/main.css" />
        <script type="module" src="scripts/settings.js" defer></script>
        <title>Settings | Books&Notes</title>
    </head>
    <body>
        <a href="#main" class="skip-link">Skip to Content</a>
        <header>
            <nav class="navbar">
                <p class="logo">Book<span style="color: orange; font-style: italic">&</span>Notes</p>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="settings.html" aria-current="page">Settings</a></li>
                </ul>
                <button class="toggle-navbar" aria-label="Toggle menu" id="toggleNavbar">&#9776;</button>
            </nav>
        </header>
        <main id="main">
            <h1>Settings</h1>
            <section aria-labelledby="capHeading">
                <h2 id="capHeading">Page Cap</h2>
                <p>Set a target for the total number of pages</p>
                <label for="capInput">Page Cap</label>
                <input type="number" id="capInput" min="0" />
                <p id="capStatus" role="status" aria-live="polite"></p>
            </section>
            <section aria-labelledby="thresholdsHeading">
                <h2 id="thresholdsHeading">Thresholds and Reading Time</h2>
                <p>Set your reading speed, how reading time is shown and convert pages to time.</p>
                <label for="pagesPerHour">Pages per hour</label>
                <input type="number" id="pagesPerHour" min="1" max="1000" value="30" />
                <select id="timeUnits">
                    <option value="minutes">Minutes</option>
                    <option value="hours">Hours</option>
                </select>
                <label for="convertPages">Convert Pages</label>
                <input type="number" id="convertPages" min="0" placeholder="220" />
                <p id="convertResult" role="status" aria-live="polite"></p>
                <p id="readingTime"></p>
            </section>
            <p id="settingsStatus" role="status" aria-live="polite"></p>
        </main>
        <footer>
            <p class="copyright">&copy; 2026 Books&Notes. All rights reserved.</p>
        </footer>
    </body>
</html>
