<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/main.css" />
    <script type="module" src="scripts/main.js" defer></script>
    <title>Books&Notes</title>
  </head>
  <body>
    <nav class="navbar">
      <h2>
        Books<span style="color: orange; font-style: italic">&</span>Notes
      </h2>
      <ul class="nav-links">
        <li><a href="home.html">Home</a></li>
        <li><a href="home.html">About</a></li>
        <li><a href="settings.html">Contact</a></li>
      </ul>
      <button id="settingsPage">Settings</button>
    </nav>
    <section class="dashboard">
      <div class="heading">
        <div>
          <h1>Welcome to Your Dashboard</h1>
          <p>Here you can manage your books, notes, and summaries.</p>
        </div>
        <div>
          <button id="addNewButton">+ Add New</button>
        </div>
      </div>
      <div class="number-cards">
        <div class="card">
          <h3 id="totalRecords">0</h3>
          <p>Total Records</p>
        </div>
        <div class="card">
          <h3 id="totalPages">350</h3>
          <p>Pages</p>
        </div>
        <div class="card">
          <h3 id="topGenre">None</h3>
          <p>Top Genre</p>
        </div>
        <div class="card">
          <h3 id="addedLast7Days">75</h3>
          <p>Books Added Last 7 days</p>
        </div>
      </div>
      <div class="search-elements">
        <div class="input-container">
          <input
            type="text"
            placeholder="Search any book name or note..."
            id="searchInput"
            aria-describedby="searchStatus"
          />
          <button id="searchButton">Search</button>
        </div>
        <div>
          <input type="checkbox" id="caseSnstvToggle" checked />
          <label for="caseToggle">Case-insensitive</label>
        </div>
      </div>
      <p id="searchStatus" role="status"></p>
      <div class="import-export">
        <button id="importButton">Import</button>
        <button id="exportButton">Export</button>
        <input
          type="file"
          id="importFile"
          accept=".json,application/json"
          hidden
        />
      </div>
      <div class="records-container">
        <table id="records-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>
                Date Added
                <button class="sort-button" id="sortByDate">&#8693;</button>
              </th>
              <th>
                Summary
                <button class="sort-button" id="sortBySummary">&#8693;</button>
              </th>
              <th>Tags</th>
              <th>
                Rating
                <button class="sort-button" id="sortByRating">&#8693;</button>
              </th>
              <th>Notes</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
    <dialog id="form-container">
      <h2 id="dialogTitle">Add Record</h2>
      <form id="addRecordForm">
        <label for="title">Title:</label>
        <input
          type="text"
          id="title"
          name="title"
          required
          placeholder="Enter title"
        /><br />

        <label for="author">Author:</label>
        <input
          type="text"
          id="author"
          name="author"
          required
          placeholder="Enter author"
        /><br />
        <label for="genre">Genre:</label>
        <input
          type="text"
          id="genre"
          name="genre"
          required
          placeholder="Enter genre"
        /><br />
        <label for="year">Year:</label>
        <input
          type="text"
          id="year"
          name="year"
          required
          placeholder="Enter year"
        /><br />
        <label for="status">Status:</label>
        <select id="status" name="status" required>
          <option value="">Select Status</option>
          <option value="read">Read</option>
          <option value="unread">Unread</option></select
        ><br />
        <label for="rating">Rating:</label>
        <input
          type="number"
          id="rating"
          name="rating"
          min="1"
          max="5"
          required
          placeholder="5"
        /><br />
        <label for="summary">Summary:</label>
        <textarea
          id="summary"
          name="summary"
          rows="4"
          cols="50"
          required
          placeholder="Enter summary"
        ></textarea
        ><br />
        <label for="tags">Tags:</label>
        <input
          type="text"
          id="tags"
          name="tags"
          placeholder="Comma-separated tags"
          required
        /><br />
        <label for="notes">Notes:</label>
        <textarea
          id="notes"
          name="notes"
          rows="4"
          cols="50"
          required
          placeholder="Enter notes"
        ></textarea
        ><br />
        <label for="type">Type:</label>
        <select id="type" name="type" required>
          <option value="">Select Type</option>
          <option value="book">Book</option>
          <option value="note">Note</option>
          <option value="summary">Summary</option></select
        ><br />
        <label for="pages">Pages</label>
        <input
          type="number"
          id="pages"
          name="pages"
          placeholder="Pages"
          required
        />
        <div class="form-buttons">
          <button type="submit" class="success" id="submitButton">
            Add Record
          </button>
          <button type="button" id="cancelButton" class="danger">Cancel</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
