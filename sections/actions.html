<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operations Form</title>
</head>
<body>
    <section>
        <h2>Add Record</h2>
        <form id="addRecordForm">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required placeholder="Enter title"><br/>

            <label for="author">Author:</label>
            <input type="text" id="author" name="author" required placeholder="Enter author"><br/>
            <label for="genre">Genre:</label>
            <input type="text" id="genre" name="genre" required placeholder="Enter genre"><br/>
            <label for="year">Year:</label>
            <input type="number" id="year" name="year" required placeholder="Enter year"><br/>
            <label for="status">Status:</label>
            <select id="status" name="status" required>
                <option value="">Select Status</option>
                <option value="read">Read</option>
                <option value="unread">Unread</option>
            </select><br/>
            <label for="rating">Rating:</label>
            <input type="number" id="rating" name="rating" min="1" max="5" required placeholder="5"><br/>
            <label for=""summary">Summary:</label>
            <textarea id="summary" name="summary" rows="4" cols="50" required placeholder="Enter summary"></textarea><br/>
            <label for="tags">Tags:</label>
            <input type="text" id="tags" name="tags" placeholder="Comma-separated tags" required><br/>
            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes" rows="4" cols="50" required placeholder="Enter notes"></textarea><br/>
            <label for="type">Type:</label>
            <select id="type" name="type" required>
                <option value="">Select Type</option>
                <option value="book">Book</option>
                <option value="note">Note</option>
                <option value="summary">Summary</option>
            </select><br><br>
            <button type="submit">Add Record</button>
        </form>
    </section>
</body>
</html>
