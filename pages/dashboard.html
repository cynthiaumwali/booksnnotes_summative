<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/main.css" />
    <script src="/scripts/main.js" defer></script>
    <title>Books&Notes</title>
  </head>
  <body>
    <nav class="navbar">
      <h2>
        Books<span style="color: orange; font-style: italic">&</span>Notes
      </h2>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button>Settings</button>
    </nav>
    <section class="dashboard">
      <div class="heading">
        <div>
          <h1>Welcome to Your Dashboard</h1>
          <p>Here you can manage your books, notes, and summaries.</p>
        </div>
        <div>
          <button id="addNewButton">+ Add New</button>
        </div>
      </div>
      <div class="number-cards">
        <div class="card">
          <h3>120</h3>
          <p>Books</p>
        </div>
        <div class="card">
          <h3>350</h3>
          <p>Notes</p>
        </div>
        <div class="card">
          <h3>75</h3>
          <p>Summaries</p>
        </div>
      </div>
      <div class="search-elements">
        <div class="input-container">
          <input type="text" placeholder="Search your notes..." />
          <button>Search</button>
        </div>
        <div>
          <label for="filter">Filter by:</label>
          <select id="filter">
            <option value="all">All</option>
            <option value="books">Books</option>
            <option value="notes">Notes</option>
            <option value="summaries">Summaries</option>
          </select>
        </div>
      </div>
      <div class="import-export">
        <button id="importBtn">Import</button>
        <button id="exportBtn">Export</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
      <div class="records-container">
        <table id="records-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Year</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
    <dialog id="form-container">
      <h2>Add Record</h2>
      <form id="addRecordForm">
        <label for="title">Title:</label>
        <input
          type="text"
          id="title"
          name="title"
          required
          placeholder="Enter title"
        /><br />

        <label for="author">Author:</label>
        <input
          type="text"
          id="author"
          name="author"
          required
          placeholder="Enter author"
        /><br />
        <label for="genre">Genre:</label>
        <input
          type="text"
          id="genre"
          name="genre"
          required
          placeholder="Enter genre"
        /><br />
        <label for="year">Year:</label>
        <input
          type="text"
          id="year"
          name="year"
          required
          placeholder="Enter year"
        /><br />
        <label for="status">Status:</label>
        <select id="status" name="status" required>
          <option value="">Select Status</option>
          <option value="read">Read</option>
          <option value="unread">Unread</option></select
        ><br />
        <label for="rating">Rating:</label>
        <input
          type="number"
          id="rating"
          name="rating"
          min="1"
          max="5"
          required
          placeholder="5"
        /><br />
        <label for="summary">Summary:</label>
        <textarea
          id="summary"
          name="summary"
          rows="4"
          cols="50"
          required
          placeholder="Enter summary"
        ></textarea
        ><br />
        <label for="tags">Tags:</label>
        <input
          type="text"
          id="tags"
          name="tags"
          placeholder="Comma-separated tags"
          required
        /><br />
        <label for="notes">Notes:</label>
        <textarea
          id="notes"
          name="notes"
          rows="4"
          cols="50"
          required
          placeholder="Enter notes"
        ></textarea
        ><br />
        <label for="type">Type:</label>
        <select id="type" name="type" required>
          <option value="">Select Type</option>
          <option value="book">Book</option>
          <option value="note">Note</option>
          <option value="summary">Summary</option></select
        ><br />
        <div class="form-buttons">
          <button type="submit" class="success">Add Record</button>
          <button type="button" id="cancelButton" class="danger">Cancel</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
